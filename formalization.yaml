version: "v0.7"

project:
  name: "AXABRA exact-Weyl / Navier--Stokes Lean bridge"
  description: >-
    A kernel-checked construction of the flat Euclidean covariant derivative
    in the AXABRA exact zero-Weyl gauge, proofs of metric compatibility and
    zero torsion, reduction to the classical Navier--Stokes operator, and a
    transparent composition with the pinned OpenAI proof establishing the
    complete alternatives (C) and (D) in the AXABRA interface.
  authors:
    - "Axel Abdel Rahamane Meghezzi (AXABRA bridge)"

sources:
  - title: "A Kernel-Checked of Navier--Stokes Blow-Up into Weyl Hydrodynamics, with a Lean-Certified Yang--Mills Application"
    id: "https://doi.org/10.5281/zenodo.22974767"
    authors:
      - "Axel Abdel Rahamane Meghezzi"
    type: "software documentation"
    relationship: "documents"
  - title: "Finite time blowup for Navier--Stokes"
    id: "https://cdn.openai.com/pdf/32d9f210-8b73-45e0-91bc-82a30aef8a9a/navier-stokes.pdf"
    authors:
      - "OpenAI"
    type: "article"
    relationship: "upstream theorem imported by the bridge"

